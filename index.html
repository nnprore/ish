<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💧 Suv Savdo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#0ea5e9;--sky2:#0284c7;--sky3:#e0f2fe;
  --ink:#0c1a2e;--ink2:#3a5068;--ink3:#8faab8;
  --mint:#10b981;--rose:#f43f5e;--rose2:#ffe4e6;
  --card:#ffffff;--bg:#f1f8fe;--border:#bfdbf7;
  --r:18px;--sh:0 4px 24px rgba(14,165,233,.13);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:4rem}
.header{background:linear-gradient(150deg,#0ea5e9 0%,#0369a1 100%);padding:1.4rem 1.2rem 3.2rem;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.header::after{content:'';position:absolute;bottom:-32px;left:0;right:0;height:64px;background:var(--bg);border-radius:60% 60% 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hbrand{display:flex;align-items:center;gap:11px}
.hicon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.3)}
.hname{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;color:#fff;line-height:1.15}
.hdate{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.hnav{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sync-row{display:flex;align-items:center;gap:8px;margin-top:10px;position:relative;z-index:1}
.sync-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:9px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:5px}
.sync-status{font-size:11px;color:rgba(255,255,255,.7)}
.wrap{padding:0 1rem;margin-top:-.3rem;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.3rem}
.scard{background:var(--card);border-radius:var(--r);padding:1rem 1.1rem;border:1px solid var(--border);box-shadow:var(--sh)}
.scard .sl{font-size:11.5px;color:var(--ink2);font-weight:500;margin-bottom:5px}
.scard .sv{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;line-height:1;color:var(--ink)}
.scard .ss{font-size:11px;color:var(--ink3);margin-top:3px}
.scard.gr .sv{color:var(--mint)}
.sec{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.plist{display:flex;flex-direction:column;gap:10px;margin-bottom:1.3rem}
.pc{background:var(--card);border-radius:var(--r);padding:1rem 1.1rem;border:1px solid var(--border);box-shadow:var(--sh)}
.ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.pn{font-family:'Sora',sans-serif;font-size:15.5px;font-weight:700}
.pp{font-size:11.5px;color:var(--ink2);margin-top:2px}
.crow{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.cbtn{width:60px;height:60px;border:none;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.cbtn.mn{background:#e0f2fe;color:var(--sky)}
.cbtn.pl{background:var(--sky);color:#fff}
.cbtn:active{opacity:.65}
.cdp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:60px;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);background:#fff}
.cn{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;line-height:1;color:var(--ink)}
.cl{font-size:10.5px;color:var(--ink3);margin-top:1px}
.psub{text-align:right;font-size:12.5px;font-weight:600;color:var(--mint);margin-top:9px}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--ink3);background:var(--card);border-radius:var(--r);border:1.5px dashed var(--border)}
.empty .ei{font-size:38px;margin-bottom:10px}
.aform{background:var(--card);border-radius:var(--r);padding:1.2rem;border:1px solid var(--border);box-shadow:var(--sh)}
.atitle{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:13px}
.fcol{display:flex;flex-direction:column;gap:10px}
input[type="text"],input[type="number"]{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--bg);outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
.abtn{width:100%;padding:15px;background:linear-gradient(135deg,var(--sky),var(--sky2));color:#fff;border:none;border-radius:13px;font-size:15.5px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 4px 16px rgba(14,165,233,.35)}
.abtn:active{opacity:.82}
.hhdr{display:flex;align-items:center;gap:10px;margin-bottom:1.3rem}
.bbtn{background:var(--card);border:1.5px solid var(--border);color:var(--sky);padding:9px 16px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer}
.hcards{display:flex;flex-direction:column;gap:12px}
.hc{background:var(--card);border-radius:var(--r);padding:1.1rem;border:1px solid var(--border);box-shadow:var(--sh)}
.dhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.dd{font-family:'Sora',sans-serif;font-size:14.5px;font-weight:700}
.dt{font-size:13.5px;font-weight:600;color:var(--mint)}
.hr2{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.hn{color:var(--ink2)}
.hv{font-weight:600;color:var(--ink)}
.hfoot{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ink3)}
.nohist{text-align:center;padding:3rem 1rem;color:var(--ink3);font-size:14px;line-height:1.6}
.toast{position:fixed;bottom:1.8rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="hrow">
    <div class="hbrand">
      <div class="hicon">💧</div>
      <div>
        <div class="hname">Suv Savdo Daftari</div>
        <div class="hdate" id="today-lbl">—</div>
      </div>
    </div>
    <button class="hnav" id="nav-btn">📋 Tarix</button>
  </div>
  <div class="sync-row">
    <button class="sync-btn" id="load-btn">🔄 Yangilash</button>
    <span class="sync-status" id="sync-status">Yuklanmoqda...</span>
  </div>
</div>

<div class="wrap">
  <div id="v-main">
    <div class="stats">
      <div class="scard">
        <div class="sl">Bugun sotildi</div>
        <div class="sv" id="s-qty">0</div>
        <div class="ss">dona</div>
      </div>
      <div class="scard gr">
        <div class="sl">Bugungi daromad</div>
        <div class="sv" id="s-sum">0</div>
        <div class="ss">so'm</div>
      </div>
    </div>

    <div class="sec">Suv turlari</div>
    <div class="plist" id="plist"></div>

    <div class="aform">
      <div class="atitle">➕ Yangi suv turi qo'shish</div>
      <div class="fcol">
        <input type="text" id="inp-name" placeholder="Suv nomi (masalan: 0.5L Nestle)" autocomplete="off">
        <input type="number" id="inp-price" placeholder="Narxi (so'm)" min="1" inputmode="numeric">
        <button class="abtn" id="add-btn">✅ Qo'shish</button>
      </div>
    </div>
  </div>

  <div id="v-hist" style="display:none">
    <div class="hhdr">
      <button class="bbtn" id="back-btn">← Orqaga</button>
      <span style="font-family:'Sora',sans-serif;font-size:16px;font-weight:700">Kunlik tarix</span>
    </div>
    <div class="hcards" id="hlist"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Ваша персональная ссылка Google Web App:
var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsa1HOo5h32euCyO2gOEPDij8gq0irBbGvUygRv2hZRuZHZo5bpsK73r_LaZxOXkVIyg/exec';

var DB = { products: [], days: {} };
var isSyncing = false;

function todayKey() {
  var d = new Date();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

function setStatus(msg) {
  document.getElementById('sync-status').textContent = msg;
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.className = 'toast'; }, 2500);
}

function loadFromGoogleSheets(showToast = false) {
  if (GOOGLE_SCRIPT_URL.indexOf('BU_YERGA') === 0 || isSyncing) return;
  isSyncing = true;
  setStatus('⏳ O\'qilmoqda...');
  
  fetch(GOOGLE_SCRIPT_URL)
    .then(function(r) { return r.json(); })
    .then(function(parsed) {
      isSyncing = false;
      if (parsed) {
        DB = parsed;
        render();
        if(showToast) toast('🔄 Ma\'lumotlar yangilandi!');
      }
      setStatus('✅ Sinxron');
    })
    .catch(function() { 
      isSyncing = false; 
      setStatus('❌ Ulanib bo\'lmadi'); 
    });
}

function todayCounts() {
  var k = todayKey();
  if (!DB.days[k]) DB.days[k] = {};
  return DB.days[k];
}

function esc(s) {
  return ('' + s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  var prods = DB.products;
  var c = todayCounts();
  var el = document.getElementById('plist');
  var tq = 0, ts = 0;

  if (!prods.length) {
    el.innerHTML = '<div class="empty"><div class="ei">💧</div>'
      + '<p>Jadvalda suv turi yo\'q<br><span style="font-size:12px">Quyidan yangi tur qo\'shing</span></p></div>';
    document.getElementById('s-qty').textContent = '0';
    document.getElementById('s-sum').textContent = '0';
    return;
  }

  var html = '';
  for (var i = 0; i < prods.length; i++) {
    var p = prods[i];
    var q = c[p.id] || 0;
    tq += q; ts += q * p.price;
    html += '<div class="pc">'
      + '<div class="ptop"><div>'
      + '<div class="pn">' + esc(p.name) + '</div>'
      + '<div class="pp">' + p.price.toLocaleString() + ' so\'m / dona</div>'
      + '</div></div>'
      + '<div class="crow">'
      + '<button class="cbtn mn" data-min="' + p.id + '" data-name="'+esc(p.name)+'" data-price="'+p.price+'">−</button>'
      + '<div class="cdp"><span class="cn" id="q-' + p.id + '">' + q + '</span><span class="cl">dona</span></div>'
      + '<button class="cbtn pl" data-pls="' + p.id + '" data-name="'+esc(p.name)+'" data-price="'+p.price+'">+</button>'
      + '</div>'
      + '<div class="psub" id="r-' + p.id + '">= ' + (q * p.price).toLocaleString() + ' so\'m</div>'
      + '</div>';
  }
  el.innerHTML = html;
  document.getElementById('s-qty').textContent = tq;
  document.getElementById('s-sum').textContent = ts.toLocaleString();
}

document.getElementById('plist').addEventListener('click', function(e) {
  var btn = e.target;
  
  var pid = btn.getAttribute('data-pls');
  if (pid) {
    var name = btn.getAttribute('data-name');
    var price = parseInt(btn.getAttribute('data-price'), 10);
    var c = todayCounts(); 
    c[pid] = (c[pid] || 0) + 1;
    
    document.getElementById('q-' + pid).textContent = c[pid];
    document.getElementById('r-' + pid).textContent = '= ' + (c[pid] * price).toLocaleString() + ' so\'m';
    
    var tq = parseInt(document.getElementById('s-qty').textContent) + 1;
    var ts = parseInt(document.getElementById('s-sum').textContent.replace(/\s/g, '')) + price;
    document.getElementById('s-qty').textContent = tq;
    document.getElementById('s-sum').textContent = ts.toLocaleString();

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        action: "add_sale",
        sana: todayKey(),
        mahsulot_id: pid,
        nomi: name,
        miqdori: 1,
        jami_summa: price
      })
    });
    return;
  }

  var mid = btn.getAttribute('data-min');
  if (mid) {
    var c = todayCounts();
    if ((c[mid] || 0) <= 0) return; 
    
    var name = btn.getAttribute('data-name');
    var price = parseInt(btn.getAttribute('data-price'), 10);
    c[mid]--;
    
    document.getElementById('q-' + mid).textContent = c[mid];
    document.getElementById('r-' + mid).textContent = '= ' + (c[mid] * price).toLocaleString() + ' so\'m';
    
    var tq = parseInt(document.getElementById('s-qty').textContent) - 1;
    var ts = parseInt(document.getElementById('s-sum').textContent.replace(/\s/g, '')) - price;
    document.getElementById('s-qty').textContent = tq;
    document.getElementById('s-sum').textContent = ts.toLocaleString();

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        action: "add_sale",
        sana: todayKey(),
        mahsulot_id: mid,
        nomi: name,
        miqdori: -1,
        jami_summa: -price
      })
    });
    return;
  }
});

document.getElementById('add-btn').addEventListener('click', function() {
  var ni = document.getElementById('inp-name');
  var pi = document.getElementById('inp-price');
  var name = ni.value.trim();
  var price = parseInt(pi.value, 10);
  
  if (!name) { toast('⚠️ Suv nomini kiriting!'); ni.focus(); return; }
  if (!price || isNaN(price) || price < 1) { toast('⚠️ To\'g\'ri narx kiriting!'); pi.focus(); return; }
  
  var abtn = this;
  abtn.disabled = true;
  abtn.textContent = '⏳ Qo\'shilmoqda...';
  
  var newId = 'p' + Date.now();
  
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({
      action: "add_product",
      id: newId,
      nomi: name,
      narxi: price,
      sana: todayKey()
    })
  }).then(function() {
    toast('✅ Google Sheets\'ga qo\'shildi!');
    ni.value = ''; pi.value = '';
    abtn.disabled = false;
    abtn.textContent = '✅ Qo\'shish';
    setTimeout(function() { loadFromGoogleSheets(false); }, 1500);
  });
});

document.getElementById('nav-btn').addEventListener('click', function() {
  var mv = document.getElementById('v-main');
  var hv = document.getElementById('v-hist');
  if (hv.style.display === 'none') {
    mv.style.display = 'none'; hv.style.display = 'block';
    this.textContent = '← Orqaga'; renderHistory();
  } else {
    hv.style.display = 'none'; mv.style.display = 'block';
    this.textContent = '📋 Tarix';
  }
});

document.getElementById('back-btn').addEventListener('click', function() {
  document.getElementById('v-hist').style.display = 'none';
  document.getElementById('v-main').style.display = 'block';
  document.getElementById('nav-btn').textContent = '📋 Tarix';
});

function renderHistory() {
  var el = document.getElementById('hlist');
  var prods = DB.products;
  var keys = Object.keys(DB.days).sort().reverse();
  var valid = [];
  
  for (var i = 0; i < keys.length; i++) {
    var c = DB.days[keys[i]];
    var ids = Object.keys(c);
    for (var j = 0; j < ids.length; j++) { if (c[ids[j]] > 0) { valid.push(keys[i]); break; } }
  }
  
  if (!valid.length) {
    el.innerHTML = '<div class="nohist">📭 Hali tarix yo\'q</div>';
    return;
  }
  
  var html = '';
  for (var i = 0; i < valid.length; i++) {
    var k = valid[i]; var c = DB.days[k];
    var tq = 0, ts = 0, rows = '';
    for (var j = 0; j < prods.length; j++) {
      var p = prods[j]; var q = c[p.id] || 0;
      if (q > 0) {
        tq += q; ts += q * p.price;
        rows += '<div class="hr2"><span class="hn">💧 ' + esc(p.name) + '</span>'
          + '<span class="hv">' + q + ' dona × ' + p.price.toLocaleString() + ' = ' + (q * p.price).toLocaleString() + ' so\'m</span></div>';
      }
    }
    if (!rows) continue;
    html += '<div class="hc"><div class="dhdr"><span class="dd">📅 ' + k + '</span>'
      + '<span class="dt">' + ts.toLocaleString() + ' so\'m</span></div>'
      + rows + '<div class="hfoot">Jami: ' + tq + ' dona sotildi</div></div>';
  }
  el.innerHTML = html;
}

document.getElementById('load-btn').addEventListener('click', function() {
  loadFromGoogleSheets(true);
});

var d = new Date();
var mn = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktyabr','Noyabr','Dekabr'];
var wn = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
document.getElementById('today-lbl').textContent = wn[d.getDay()] + ', ' + d.getDate() + ' ' + mn[d.getMonth()] + ' ' + d.getFullYear();

loadFromGoogleSheets(false);
setInterval(function() { loadFromGoogleSheets(false); }, 10000);
</script>
</body>
</html>
